<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 16 - Responsive Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <section class="device mobile">
            <h1>MOBILE</h1>
            <div class="layout mobile-layout">
                <header class="block header">HEADER</header>
                <nav class="block menu">MENU</nav>
                <section class="block hero">HERO</section>
                <section class="block main">MAIN</section>
                <section class="block banner">BANNER</section>
                <section class="block extra">EXTRA</section>
                <section class="block image">IMAGE</section>
            </div>
        </section>

        <section class="device tablet">
            <h1>TABLET</h1>
            <div class="layout tablet-layout">
                <header class="block header">HEADER</header>
                <section class="block hero">HERO</section>
                <nav class="block menu">MENU</nav>
                <section class="block main">MAIN</section>
                <section class="block banner">BANNER</section>
                <section class="block extra">EXTRA</section>
                <section class="block image">IMAGE</section>
            </div>
        </section>

        <section class="device desktop">
            <h1>DESKTOP</h1>
            <div class="layout desktop-layout">
                <header class="block header">HEADER</header>
                <nav class="block menu">MENU</nav>
                <section class="block hero">HERO</section>
                <section class="block main">MAIN</section>
                <section class="block blank"></section>
                <section class="block image">IMAGE</section>
                <section class="block extra">EXTRA</section>
                <section class="block banner">BANNER</section>
            </div>
        </section>
    </main>
</body>
</html>
